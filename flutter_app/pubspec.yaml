name: finance_advisor_mobile
description: A Virtual Personal Finance Advisor mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  fl_chart: ^0.63.0
  google_fonts: ^6.2.1
  http: ^1.1.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_markdown: ^0.7.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

# path_provider_android 2.3.1 pulls in jni 1.0.0 which triggers the same
# NativeCallable FFI crash in Dart 3.12.0.  Pin to 2.2.22 to remove jni.
# The remaining crash (objective_c 9.x / NativeCallable) only affects the
# Windows-desktop JIT build path; use `flutter run -d chrome` for development.
dependency_overrides:
  path_provider_android: "2.2.22"
